# Builds the standalone program for each OS, only when started by hand from the Actions tab.
name: Standalone builds
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows names its own tar, as the runner's PATH may reach Git's, which cannot write zips.
          - {os: windows-latest, tar: 'C:\Windows\System32\tar.exe', platform: windows-x64, ext: zip}
          - {os: macos-latest, tar: tar, platform: macos-arm64, ext: zip}
          - {os: ubuntu-22.04, tar: tar, platform: linux-x64, ext: tar.gz}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m PyInstaller tools/standalone.spec --noconfirm
      - run: python tools/smoke-standalone.py dist/open-chart-editor/open-chart-editor
      # Human-readable version, plus the exact commit it was built from: v<plugin.json version>-<short sha>.
      - id: archive
        shell: bash
        run: |
          base=$(python -c "import json;print(json.load(open('plugin.json'))['version'])")
          sha=$(git rev-parse --short HEAD)
          echo "name=open-chart-editor-${{ matrix.platform }}-v${base}-${sha}.${{ matrix.ext }}" >> "$GITHUB_OUTPUT"
      # Archived here because artifact uploads lose the program's executable bit.
      - run: ${{ matrix.tar }} -a -cf ${{ steps.archive.outputs.name }} -C dist open-chart-editor
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.archive.outputs.name }}
          archive: false
          if-no-files-found: error
