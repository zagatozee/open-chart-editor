# Builds the standalone program for each OS, plus a ready-to-use FeedBack plugin zip, only
# when started by hand from the Actions tab. Optionally also publishes a GitHub Release with
# all four archives attached - also opt-in per run, never automatic, via "publish_release".
name: Standalone builds
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Also publish a GitHub Release with the build archives attached
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      value: ${{ steps.compute.outputs.value }}
    steps:
      - uses: actions/checkout@v5
      # Human-readable version, plus the exact commit it was built from: v<plugin.json version>-<short sha>.
      - id: compute
        run: |
          base=$(python3 -c "import json;print(json.load(open('plugin.json'))['version'])")
          sha=$(git rev-parse --short HEAD)
          echo "value=v${base}-${sha}" >> "$GITHUB_OUTPUT"
  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # All three pack to .zip. Windows/macOS tar is bsdtar (libarchive), which can write
          # zip via -a; Linux's tar is GNU tar, which can't, so that leg uses zip directly.
          # (A prior .tar.gz leg here reliably failed GitHub's artifact download/extract -
          # see the standalone-gp-converters PR history - so every archive is a plain zip now.)
          # Forward slashes here: this step runs under bash (shell: bash below), which treats a
          # backslash as an escape character and silently drops it - C:\Windows\...\tar.exe
          # becomes C:WindowsSystem32tar.exe and "command not found". Windows accepts either.
          - {os: windows-latest, platform: windows-x64, pack: 'C:/Windows/System32/tar.exe -a -cf "$ARCHIVE" -C dist open-chart-editor'}
          - {os: macos-latest, platform: macos-arm64, pack: 'tar -a -cf "$ARCHIVE" -C dist open-chart-editor'}
          - {os: ubuntu-22.04, platform: linux-x64, pack: '(cd dist && zip -rq "$GITHUB_WORKSPACE/$ARCHIVE" open-chart-editor)'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m PyInstaller tools/standalone.spec --noconfirm
      - run: python tools/smoke-standalone.py dist/open-chart-editor/open-chart-editor
      - id: archive
        shell: bash
        run: echo "name=open-chart-editor-${{ matrix.platform }}-${{ needs.version.outputs.value }}.zip" >> "$GITHUB_OUTPUT"
      # Archived here because artifact uploads lose the program's executable bit.
      - shell: bash
        env:
          ARCHIVE: ${{ steps.archive.outputs.name }}
        run: ${{ matrix.pack }}
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.archive.outputs.name }}
          archive: false
          if-no-files-found: error
  plugin:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - id: stage
        # Same tools/install-local.py every manual plugin install uses, so this is exactly what
        # that script would copy - not a second, separately-maintained file list.
        run: |
          set -e
          stage=/tmp/oce-plugin-stage/open_chart_editor
          mkdir -p "$(dirname "$stage")"
          digest=$(python tools/install-local.py --destination "$stage" | python3 -c "import json,sys;print(json.load(sys.stdin)['sourceDigest'])")
          python tools/install-local.py --destination "$stage" --apply --expect-source-digest "$digest"
          python -m py_compile $(find "$stage" -name '*.py')
          python3 -c "import json;d=json.load(open('$stage/plugin.json'));assert d['id']=='open_chart_editor'"
          name="open-chart-editor-feedback-plugin-${{ needs.version.outputs.value }}.zip"
          (cd "$(dirname "$stage")" && zip -rq "$GITHUB_WORKSPACE/$name" open_chart_editor)
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.stage.outputs.name }}
          archive: false
          if-no-files-found: error
  release:
    needs: [version, build, plugin]
    if: ${{ inputs.publish_release }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
          pattern: open-chart-editor-*
      # Each build/plugin job uploads with archive:false against an already-zipped path, so that
      # GitHub stores the zip's own entries - including their Unix permission bits, which its
      # default handling of loose files otherwise strips - as the artifact's file tree, not the
      # zip file itself. Downloaded, each artifact is therefore a folder (named after the
      # archive), holding one subfolder (the original top-level folder from inside that zip:
      # open-chart-editor for the three builds, open_chart_editor for the plugin). Without
      # merge-multiple they land in separate per-artifact folders rather than colliding (all
      # three platform builds share that same open-chart-editor subfolder name); each is re-zipped
      # here into one clean file per release asset, reproducing what a direct artifact download
      # from the Actions UI already gives a person who skips the release and just grabs one build.
      - shell: bash
        run: |
          set -e
          mkdir -p release-assets
          for dir in artifacts/*/; do
            name="$(basename "$dir")"
            inner="$(basename "$(find "$dir" -mindepth 1 -maxdepth 1 -type d)")"
            (cd "$dir" && zip -rq "$GITHUB_WORKSPACE/release-assets/$name" "$inner")
          done
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.version.outputs.value }}" release-assets/* \
            --repo "${{ github.repository }}" \
            --title "Open Chart Editor ${{ needs.version.outputs.value }}" \
            --notes "Standalone builds for Windows, macOS and Linux, plus a ready-to-use FeedBack plugin zip. Built from commit ${{ github.sha }}."
